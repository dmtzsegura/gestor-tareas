<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">

</head>

<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-2 sidebar vh-100 p-3 d-flex flex-column">
        <h5 class="text-white mb-4"><i class="bi bi-check2-square"></i> Gestor de Tareas</h5>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}"><i class="bi bi-house"></i>
              Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person-check"></i> Mis tareas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-list-ul"></i> Todas las tareas</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-calendar3"></i> Calendario</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('nueva_tarea') }}"><i class="bi bi-plus-lg"></i>
              Nueva tarea</a></li>
        </ul>
        <a class="nav-link mt-auto" href="#"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a>
      </div>

      <div class="col-10 p-3">
        {% with mensajes = get_flashed_messages() %}
        {% if mensajes %}
        {% for mensaje in mensajes %}
        <div class="alert alert-warning">{{ mensaje }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}
        {% endblock %}
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
